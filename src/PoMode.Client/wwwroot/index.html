<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover lets the page paint under a notch and a home indicator; the header and
         the page gutters buy their margin back with env(safe-area-inset-*), so the only thing that
         reaches the rounded corners is background. Without it the browser letterboxes the page and
         a phone loses vertical budget this app is trying to fit content into. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>PoMode</title>
    <base href="/" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E%F0%9F%8E%B5%3C/text%3E%3C/svg%3E" />
    <!-- Radzen ships separate light and dark bases. Loading both under prefers-color-scheme media
         queries makes the component library follow the device with no JS. Without the dark base,
         Radzen cards stay white while the app flips to light text: unreadable. -->
    <link rel="stylesheet" href="_content/Radzen.Blazor/css/material-base.css?v=12.1.12"
          media="(prefers-color-scheme: light)" />
    <link rel="stylesheet" href="_content/Radzen.Blazor/css/material-dark-base.css?v=12.1.12"
          media="(prefers-color-scheme: dark)" />
    <!-- po-tokens.css first among the app's sheets (Po web standard): the app's colours, the
         self-hosted Inter and Space Grotesk, and the shell (header, stamp, /diag cards).
         pm-tokens.css aliases PoMode's own tokens to it. -->
    <link rel="preload" href="fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="css/po-tokens.css" />
    <link rel="stylesheet" href="css/pm-tokens.css" />
    <link rel="stylesheet" href="css/po-motion.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="PoMode.Client.styles.css" />
    <!-- Installable, and a share target for audio on Android: a voice memo can be shared straight
         into PoMode instead of being saved and then found again. theme-color is the accent, so the
         installed app's title bar matches the header rather than defaulting to white. -->
    <link rel="manifest" href="manifest.webmanifest" />
    <!-- One theme-color per scheme, so the installed app's title bar matches the page it is framing
         rather than showing a light accent above a dark UI. -->
    <meta name="theme-color" content="#f6f7fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1117" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="PoMode" />
    <!-- Tab with nothing focused opens /po-dev.html, the developer window (Po web standard). -->
    <script src="js/po-devwindow.js"></script>
</head>
<body>
    <div id="app">Loading…</div>
    <script src="_framework/blazor.webassembly.js"></script>
    <script src="_content/Radzen.Blazor/Radzen.Blazor.js?v=12.1.12"></script>
    <script type="module">
        // Registered from a module so a browser without service workers simply skips it, and after
        // load so registration never competes with the WASM runtime the user is waiting on.
        import('./js/shell/pwa.js').then(pwa => pwa.register()).catch(() => { });
    </script>
</body>
</html>
