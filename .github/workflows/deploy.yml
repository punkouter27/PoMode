name: Build & Deploy

# The one workflow in every Po .NET web repo: check formatting, build, run the Unit tier, publish,
# deploy to App Service, confirm the new build is the one answering. A red check stops the deploy
# and the live site keeps its last good build. Integration, E2E and Bicep run locally, not here.
#
# Repo variables: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID (GitHub OIDC sign-in),
#                 AZURE_WEBAPP_NAME, AZURE_RESOURCE_GROUP (what is deployed, where); all set by
#                 scripts/ensure-azure-access.ps1.
# Layout it relies on: one *.slnx at the root, global.json, src/*.Api/*.csproj, tests/*.Unit/*.csproj
# (which references the Api, so building it builds what is published).

on:
  push:
    branches: [master]
    paths-ignore: ['*.md']
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  deploy:
    name: Build & deploy
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write   # azure/login OIDC
    environment:
      name: production
      url: https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net
    env:
      BASE_URL: https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net
    steps:
      - uses: actions/checkout@v7   # shallow is enough: the build stamp reads only HEAD's date

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Check formatting
        run: dotnet format *.slnx --verify-no-changes

      - name: Build (Api, Client, Unit)
        run: dotnet build tests/*.Unit/*.csproj -c Release

      - name: Unit tests
        run: dotnet test tests/*.Unit/*.csproj -c Release --no-build

      - name: Publish
        run: dotnet publish src/*.Api/*.csproj -c Release --no-build -o publish

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          resource-group-name: ${{ vars.AZURE_RESOURCE_GROUP }}
          package: publish

      - name: Confirm this commit is live (/health/live X-Commit)
        run: |
          for attempt in $(seq 1 40); do
            commit=$(curl -s -D - -o /dev/null --max-time 20 "$BASE_URL/health/live" | tr -d '\r' | awk -F': ' 'tolower($1)=="x-commit" {print $2}' || true)
            [ "$commit" = "$GITHUB_SHA" ] && { echo "Live on $GITHUB_SHA (attempt $attempt)"; exit 0; }
            sleep 10
          done
          echo "::error::/health/live serves ${commit:-no X-Commit header}, not $GITHUB_SHA"; exit 1
